name: Actualizar Canales CIC TV

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'listas/**'        # corre al subir cualquier archivo a listas/
      - 'fuentes.txt'      # por compatibilidad

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Mostrar archivos en listas/
        run: |
          echo "═══════════════════════════════"
          echo "Archivos en listas/:"
          echo "═══════════════════════════════"
          ls listas/ 2>/dev/null || echo "(carpeta vacía o no existe)"

      - name: Ejecutar actualizador
        run: python actualizar.py
        timeout-minutes: 30

      - name: Verificar canales.json
        run: |
          python3 << 'PYEOF'
          import json
          with open('canales.json') as f:
              d = json.load(f)
          print(f"Total:   {d['stats']['total']}")
          print(f"Vivos:   {d['stats']['vivos']}")
          print(f"Generado: {d['generado']}")
          PYEOF

      - name: Commit y push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CIC TV Bot"
          git add canales.json radios.json
          FECHA=$(date -u '+%Y-%m-%d %H:%M')
          VIVOS=$(python3 -c "import json; d=json.load(open('canales.json')); print(d['stats']['vivos'])")
          RADIOS=$(python3 -c "import json; d=json.load(open('radios.json')); print(d['total'])")
          git diff --staged --quiet || git commit -m "Bot: $VIVOS canales · $RADIOS radios [$FECHA UTC]"
          git push

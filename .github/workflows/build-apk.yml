name: Build CIC TV Lite APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app-lite/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build APK
        run: |
          cd app-lite
          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIC-TV-Lite
          path: app-lite/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

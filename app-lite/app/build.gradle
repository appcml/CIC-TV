plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cictv.lite'
    compileSdk 34

    defaultConfig {
        applicationId "com.cictv.lite"
        minSdk 21          // Android 5.0 — cubre prácticamente todos los TV boxes
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug  // Para CI; en producción usar keystore propio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // ExoPlayer — reproductor HLS nativo (ultra liviano)
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // AppCompat (necesario para AppCompatActivity)
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Coroutines (para cargar JSON en background)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

name: Build CIC TV Lite APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app-lite/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generar gradlew si no existe
        run: |
          if [ ! -f "app-lite/gradlew" ]; then
            cd app-lite && gradle wrapper --gradle-version 8.6 && chmod +x gradlew
          else
            chmod +x app-lite/gradlew
          fi

      - name: Build APK
        run: cd app-lite && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIC-TV-Lite
          path: app-lite/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
